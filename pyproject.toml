[project]
name = "cricket-dataset"
version = "0.1.0"
description = "Pipeline that builds the Ultimate Ball-by-Ball Cricket Dataset from Cricsheet and Cricinfo"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "requests>=2.31",
    "playwright>=1.45",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "scikit-learn>=1.4", "scipy>=1.12", "joblib>=1.3"]
analysis = ["scikit-learn>=1.4", "scipy>=1.12", "joblib>=1.3"]
assets = ["pillow>=10.1"]
notebooks = ["matplotlib>=3.8", "nbformat>=5.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cricket_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
